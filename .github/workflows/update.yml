name: 更新基金数据

on:
  schedule:
    # GitHub cron 只认 UTC；北京时间 = UTC + 8
    - cron: '0 22 * * *'   # 北京时间 06:00（美股已收盘，当日完整日K已出）
    - cron: '0 8 * * *'    # 北京时间 16:00（A 股收盘后，当日净值更新一次）
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行抓取脚本
        run: python scrape.py

      - name: 提交 data.json / data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js kline_data.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "更新基金数据 $(date -u +%Y-%m-%d)"
            git push
          fi
