<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纳指100 / 标普500 日K线</title>
<script src="echarts.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --border: #e5e7eb; --text: #1f2937; --muted: #6b7280;
    --up: #dc2626; --down: #16a34a;
    --ma5: #f59e0b; --ma10: #2563eb; --ma20: #7c3aed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; padding: 24px 16px 60px; }
  .container { max-width: 1080px; margin: 0 auto; }
  header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  header .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .chart-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px 8px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .chart-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 6px; }
  .chart-title { font-size: 15px; font-weight: 700; }
  .chart-price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart-price.up { color: var(--up); } .chart-price.down { color: var(--down); }
  .chart-chg { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart-chg.up { color: var(--up); } .chart-chg.down { color: var(--down); }
  .legend { display: inline-flex; gap: 12px; font-size: 12px; color: var(--muted); margin-left: auto; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .range { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .range button { border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 2px 9px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .range button.active { background: var(--text); color: #fff; border-color: var(--text); }
  .chart-wrap { height: 480px; }
  @media (max-width: 720px) { .chart-wrap { height: 340px; } }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>纳指100 / 标普500 日K线</h1>
    <div class="sub">数据源：东方财富（US 指数日K） · 红涨绿跌 · 悬停看开高低收 · 滚轮 / 底部滑杆拖拽缩放</div>
  </header>

  <div class="chart-block" data-idx="纳指100">
    <div class="chart-head">
      <span class="chart-title">纳斯达克100</span>
      <span class="chart-price" id="price-纳指100">—</span>
      <span class="chart-chg" id="chg-纳指100">—</span>
      <span class="legend">
        <span><i style="background:var(--ma5)"></i>MA5 <b id="ma5-纳指100">—</b></span>
        <span><i style="background:var(--ma10)"></i>MA10 <b id="ma10-纳指100">—</b></span>
        <span><i style="background:var(--ma20)"></i>MA20 <b id="ma20-纳指100">—</b></span>
      </span>
      <span class="range" id="range-纳指100"></span>
    </div>
    <div class="chart-wrap" id="wrap-纳指100"></div>
  </div>

  <div class="chart-block" data-idx="标普500">
    <div class="chart-head">
      <span class="chart-title">标普500</span>
      <span class="chart-price" id="price-标普500">—</span>
      <span class="chart-chg" id="chg-标普500">—</span>
      <span class="legend">
        <span><i style="background:var(--ma5)"></i>MA5 <b id="ma5-标普500">—</b></span>
        <span><i style="background:var(--ma10)"></i>MA10 <b id="ma10-标普500">—</b></span>
        <span><i style="background:var(--ma20)"></i>MA20 <b id="ma20-标普500">—</b></span>
      </span>
      <span class="range" id="range-标普500"></span>
    </div>
    <div class="chart-wrap" id="wrap-标普500"></div>
  </div>

  <footer>日K数据由 kline_data.py 生成（kline_data.js），双击本页需先运行该脚本刷新数据</footer>
</div>

<script src="kline_echarts.js"></script>
<script src="kline_data.js"></script>
<script>
// 渲染引擎为共用模块 kline_echarts.js（Apache ECharts 本地化部署）
['纳指100', '标普500'].forEach(function (idx) {
  window.KLINE_ECHARTS.init({
    idx: idx,
    elId: 'wrap-' + idx,
    priceId: 'price-' + idx,
    chgId: 'chg-' + idx,
    maIds: { ma5: 'ma5-' + idx, ma10: 'ma10-' + idx, ma20: 'ma20-' + idx },
    rangeBoxId: 'range-' + idx,
  });
});
</script>
</body>
</html>
